name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  web-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20', cache: 'npm'}
      - run: npm install
      - run: npm run typecheck
      - run: npm run build:web
  predictor:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: services/predictor}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: 'pip', cache-dependency-path: services/predictor/requirements.txt}
      - run: pip install -r requirements.txt
      - run: pytest -q
